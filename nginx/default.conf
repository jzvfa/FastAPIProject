# 浏览器 → Nginx:80 →（静态文件自己返回 / API 转给 FastAPI）
server {
    listen 80;
    server_name localhost;

    # AI 对话可能较慢，避免 Nginx 过早断开
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ---------- 静态前端：由 Nginx 直接提供 ----------
    # 浏览器请求 /static/css/style.css
    # → 磁盘 /usr/share/nginx/html/css/style.css（compose 里挂载了 ./frontend）
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ---------- API / 文档：反向代理到 FastAPI 容器 ----------
    # 服务名 app 来自 docker-compose 里的 services.app
    location /auth/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /books/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：关掉缓冲，否则字会攒一批才到浏览器
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /docs {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: book-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: book-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: book-api
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    environment:
      # 名字必须和 config.py 里 os.getenv(...) 一致
      # Docker 网络里主机名用服务名 mysql，不能写 localhost
      SQLALCHEMY_DATABASE_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - ./logs:/app/logs

volumes:
  mysql_data:
